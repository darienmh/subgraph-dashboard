---
# Construye la imagen Docker del frontend Next.js y la publica
# en el GitLab Container Registry ($CI_REGISTRY_IMAGE).
#
# La imagen es genérica — las variables de entorno se configuran en
# el ECS Task Definition 
docker-job:
  image: docker:27
  stage: docker
  needs:
    - job: build-job
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "environment/dev"
    - if: $CI_COMMIT_BRANCH == "environment/prod"
    - if: $CI_COMMIT_TAG
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    BUILD_CACHE_IMAGE: "$CI_REGISTRY_IMAGE:buildcache"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - |
      set -e
      IMAGE_BASE="$CI_REGISTRY_IMAGE"
      PACKAGE_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)
      test -n "$PACKAGE_VERSION" || (echo "ERROR: cannot resolve version from package.json" && exit 1)
      IMAGE_TAG="$IMAGE_BASE:$PACKAGE_VERSION"

      docker buildx create --use --name ci-builder || docker buildx use ci-builder

      TAG_ARGS="-t $IMAGE_TAG"

      case "$CI_COMMIT_BRANCH" in
        environment/*)
          ENV_TAG="${CI_COMMIT_BRANCH#environment/}"
          TAG_ARGS="$TAG_ARGS -t $IMAGE_BASE:${ENV_TAG}-latest"
          ;;
      esac

      docker buildx build \
        --pull \
        --push \
        --cache-from=type=registry,ref="$BUILD_CACHE_IMAGE" \
        --cache-to=type=registry,ref="$BUILD_CACHE_IMAGE",mode=max \
        $TAG_ARGS \
        .

      echo "──────────────────────────────────────"
      echo "Published images:"
      echo "  $IMAGE_TAG"
      [ -n "$ENV_TAG" ] && echo "  $IMAGE_BASE:${ENV_TAG}-latest"
      echo "──────────────────────────────────────"
