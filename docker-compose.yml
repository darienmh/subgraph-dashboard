# Deploy behind Traefik. Joins graph-node's internal network to read :8030 / :8040
# directly (no public metrics exposure), and the proxy network for Traefik.
#
# All instance-specific values come from a local .env (not committed):
#   SUBGRAPH_NAME, GRAPH_STATUS_URL, GRAPH_METRICS_URL, DASH_HOST
# plus the graph-node network name below if yours differs.
networks:
  proxy:
    external: true
  graphnet:
    external: true
    name: ${GRAPH_NETWORK:-graph-node_graph}

services:
  dashboard:
    build: .
    image: subgraph-dashboard:latest
    container_name: subgraph-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3009"
      HOSTNAME: 0.0.0.0
    networks:
      - proxy
      - graphnet
    labels:
      - traefik.enable=true
      - "traefik.http.routers.subgraph-dashboard.rule=Host(`${DASH_HOST}`)"
      - traefik.http.routers.subgraph-dashboard.entrypoints=websecure
      - traefik.http.routers.subgraph-dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.subgraph-dashboard.service=subgraph-dashboard
      - traefik.http.services.subgraph-dashboard.loadbalancer.server.port=3009
      # To require auth, create a middleware and add:
      # - traefik.http.routers.subgraph-dashboard.middlewares=<your-auth>@file
